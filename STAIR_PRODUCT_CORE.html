<!doctype html>
<html lang="en" data-theme="auto" data-svg-scale="2">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stair 产品核心</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --panel: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #dbe3ef;
      --button: #ffffff;
      --button-hover: #f1f5f9;
      --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      --zoom: 1;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b1020;
        --panel: #101827;
        --ink: #e5edf7;
        --muted: #93a4b8;
        --line: #233047;
        --button: #121c2e;
        --button-hover: #17243a;
        --shadow: 0 22px 55px rgba(0, 0, 0, 0.38);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1020;
      --panel: #101827;
      --ink: #e5edf7;
      --muted: #93a4b8;
      --line: #233047;
      --button: #121c2e;
      --button-hover: #17243a;
      --shadow: 0 22px 55px rgba(0, 0, 0, 0.38);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .toolbar .title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 650;
      color: var(--ink);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    button {
      min-width: 36px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--button);
      color: var(--ink);
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover { background: var(--button-hover); }
    button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

    .viewport {
      overflow: auto;
      padding: clamp(16px, 4vw, 44px);
    }

    .diagram-shell {
      width: max-content;
      min-width: min(100%, 1200px);
      margin: 0 auto;
      transform: scale(var(--zoom));
      transform-origin: top center;
      transition: transform 140ms ease;
    }

    .diagram-stage {
      width: min(calc(100vw - clamp(32px, 8vw, 88px)), 1200px);
      aspect-ratio: 1200 / 1320;
      min-width: min(100%, 320px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .diagram-stage > svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    @media (max-width: 640px) {
      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .controls {
        justify-content: space-between;
      }

      button {
        flex: 1;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const root = document.documentElement;
      const stage = document.querySelector('.diagram-stage');
      const svg = stage.querySelector('svg');
      const title = document.getElementById('diagram-title');
      const hdScale = Number.parseFloat(root.dataset.svgScale || '2') || 2;
      let zoom = 1;

      if (title) title.textContent = document.title;
      if (svg) {
        svg.setAttribute('role', 'img');
        svg.setAttribute('aria-label', document.title);
      }

      function setZoom(next) {
        zoom = Math.min(2.5, Math.max(0.4, next));
        root.style.setProperty('--zoom', zoom.toFixed(2));
      }

      function svgBaseSize(svgElement) {
        const viewBox = svgElement.getAttribute('viewBox');
        if (viewBox) {
          const parts = viewBox.trim().split(/\s+/).map(Number);
          if (parts.length === 4 && parts.every(Number.isFinite)) {
            return { width: parts[2], height: parts[3] };
          }
        }
        const width = Number.parseFloat(svgElement.getAttribute('width'));
        const height = Number.parseFloat(svgElement.getAttribute('height'));
        return {
          width: Number.isFinite(width) ? width : svgElement.getBoundingClientRect().width,
          height: Number.isFinite(height) ? height : svgElement.getBoundingClientRect().height
        };
      }

      function downloadSvg(scale = 1) {
        if (!svg) return;
        const clone = svg.cloneNode(true);
        const size = svgBaseSize(svg);
        if (scale !== 1) {
          clone.setAttribute('width', Math.round(size.width * scale));
          clone.setAttribute('height', Math.round(size.height * scale));
          if (!clone.getAttribute('viewBox')) {
            clone.setAttribute('viewBox', `0 0 ${size.width} ${size.height}`);
          }
        }
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        const source = new XMLSerializer().serializeToString(clone);
        const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const suffix = scale === 1 ? '' : `@${scale}x`;
        link.download = (document.title || 'diagram').replace(/[^a-z0-9._-]+/gi, '-').toLowerCase() + suffix + '.svg';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const action = button.dataset.action;
        if (action === 'zoom-in') setZoom(zoom + 0.1);
        if (action === 'zoom-out') setZoom(zoom - 0.1);
        if (action === 'reset') setZoom(1);
        if (action === 'download-svg') downloadSvg(1);
        if (action === 'download-svg-hd') downloadSvg(hdScale);
      });
    })();
  </script>
